<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Aqua Element — image coming soon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6fc"/>
      <stop offset="1" stop-color="#cfeaf6"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc4e6"/>
      <stop offset="1" stop-color="#1b9fd0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- water droplet -->
  <path d="M200 96
           C200 96 132 178 132 232
           a68 68 0 1 0 136 0
           C268 178 200 96 200 96 Z"
        fill="url(#drop)"/>
  <!-- highlight -->
  <path d="M174 226
