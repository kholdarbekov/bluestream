# Production overlay for single-host docker compose up.
#
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
#
# Deployment target: single host. Swarm-only directives (placement
# constraints, replicas, overlay networks) are intentionally not used —
# they're no-ops under `docker compose up` and would mislead readers. To
# scale workers on a single host, use `--scale celery_worker=N` instead
# of `replicas`.
#
# What this overlay does on top of the dev base:
#  - flips FLASK_ENV/DEBUG to production for business_app
#  - tightens FLOWER_BASIC_AUTH from optional to required
#  - bumps resource limits and gunicorn / celery worker counts
#  - adds production tuning for postgres (pg_stat_statements, WAL, logging)
#    and redis (snapshot policy, memory cap, optional auth)
#  - sets PROMETHEUS_MULTIPROC_DIR for gunicorn workers' shared metrics
#  - adds the monitoring stack (prometheus, alertmanager, grafana, loki)
#    on 127.0.0.1 — access via SSH tunnel
#
# All host-bound ports inherited from the base file are 127.0.0.1-only,
# so traffic enters through nginx (port 81) and the rest stays local to
# the host.

services:
  postgres:
    environment:
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
      -c log_destination=stderr
      -c logging_collector=on
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
      -c log_statement=ddl
      -c log_temp_files=0
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  redis:
    # REDIS_PASSWORD is optional — leave empty to run without auth, or set
    # it in .env to require a password. If you set it, also include the
    # password in REDIS_URL for every consuming service.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 60
      --timeout 300
      --tcp-backlog 511
      --databases 16
      --stop-writes-on-bgsave-error yes
      --rdbcompression yes
      --rdbchecksum yes
      --requirepass ${REDIS_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  business_app:
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - GUNICORN_WORKERS=4
      - GUNICORN_THREADS=2
      - GUNICORN_MAX_REQUESTS=2000
      - GUNICORN_MAX_REQUESTS_JITTER=200
      - GUNICORN_WORKER_CONNECTIONS=1000
      - GUNICORN_TIMEOUT=60
      - GUNICORN_KEEPALIVE=10
      # INF-003: prometheus_client multiprocess shared dir (must be writable
      # by every worker; ephemeral tmpfs is ideal — counters are re-derived
      # on boot).
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prom-multiproc
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 32768
        hard: 32768

  telegram_bot:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  celery_worker:
    environment:
      # Force production regardless of what .env says — celery imports
      # business_app code, so this needs to match business_app above.
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - CELERY_WORKER_CONCURRENCY=8
      - CELERY_WORKER_MAX_MEMORY_PER_CHILD=500000
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=1000
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    command: >
      celery -A business_app.tasks.celery_app worker
      -E
      --loglevel=info
      -Q celery,payment,notifications,delivery,analytics,subscriptions,orders,maintenance,loyalty
      --concurrency=8
      --max-memory-per-child=500000
      --max-tasks-per-child=1000
      --optimization=fair
      --prefetch-multiplier=1

  celery_beat:
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  flower:
    environment:
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:?FLOWER_BASIC_AUTH must be set, e.g. admin:somelongpassword}

  celery_exporter:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  admin_ui:
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-https://aqua-element.uz/api/v1}
      - REACT_APP_ENVIRONMENT=${ENVIRONMENT:-production}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - alertmanager
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # INF-003: Alertmanager routes Prometheus alerts to Slack. The webhook
  # URL is loaded via Compose file-mount secret at
  # /run/secrets/slack_webhook_url — see monitoring/alertmanager.yml.
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - slack_webhook_url
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address='  # single-node; disable gossip to avoid warning spam
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      # GRAFANA_PASSWORD defaults to `admin` for backwards compatibility —
      # set it in .env to something real before exposing Grafana to anyone.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:latest
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:

# INF-003: Alertmanager receiver credential (Slack webhook URL).
# File-mount secret for plain Docker Compose (non-Swarm). The file must
# exist at the path below before `docker compose up` — see README or
# INF-003 setup notes for how to populate it. chmod 600 recommended so
# only the docker daemon / compose user can read it.
secrets:
  slack_webhook_url:
    file: ./secrets/slack_webhook_url.txt
