# Production Docker Compose configuration with strict resource limits
# Use with: docker-compose -f docker-compose.yml -f docker-compose.production.yml up

services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
      placement:
        constraints:
          - node.role == manager
    environment:
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
      -c log_destination=stderr
      -c logging_collector=on
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
      -c log_statement=ddl
      -c log_temp_files=0

  redis:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    command: >
      redis-server
      --appendonly yes
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 60
      --timeout 300
      --tcp-backlog 511
      --databases 16
      --stop-writes-on-bgsave-error yes
      --rdbcompression yes
      --rdbchecksum yes
      --requirepass ${REDIS_PASSWORD:-}

  business_app:
    environment:
      - GUNICORN_WORKERS=4
      - GUNICORN_THREADS=2
      - GUNICORN_MAX_REQUESTS=2000
      - GUNICORN_MAX_REQUESTS_JITTER=200
      - GUNICORN_WORKER_CONNECTIONS=1000
      - GUNICORN_TIMEOUT=60
      - GUNICORN_KEEPALIVE=10
      # INF-003: prometheus_client multiprocess shared dir (must be writable by
      # every worker; ephemeral tmpfs is ideal — counters are re-derived on boot).
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prom-multiproc
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
      placement:
        constraints:
          - node.role == manager
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 32768
        hard: 32768

  telegram_bot:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  celery_worker:
    environment:
      - CELERY_WORKER_CONCURRENCY=8
      - CELERY_WORKER_MAX_MEMORY_PER_CHILD=500000
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=1000
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
      replicas: 2
    command: >
      celery -A business_app.tasks.celery_app worker
      -E
      --loglevel=info
      --concurrency=8
      --max-memory-per-child=500000
      --max-tasks-per-child=1000
      --optimization=fair
      --prefetch-multiplier=1

  celery_beat:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      placement:
        constraints:
          - node.role == manager

  admin_ui:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # CEL-006: Flower is stateful (persists task history to flower_data volume)
  # so pin to manager node like celery_beat. Internal-only — no published port.
  flower:
    deploy:
      placement:
        constraints:
          - node.role == manager

  # CEL-006: Stateless event consumer; can run on any node. Tightened resource
  # ceiling — exporter footprint is small.
  celery_exporter:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # Production monitoring services
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - alertmanager
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped

  # INF-003: Alertmanager for routing Prometheus alerts to Slack.
  # Secret material (Slack webhook URL) is loaded via Docker Compose file-mount
  # secret at /run/secrets/slack_webhook_url — see monitoring/alertmanager.yml.
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - slack_webhook_url
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address='  # single-node; disable gossip to avoid warning spam
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped

  # Log aggregation
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:

# INF-003: Alertmanager receiver credential (Slack webhook URL).
# File-mount secret for plain Docker Compose (non-Swarm). The file must exist
# at the path below before `docker compose up` — see README or INF-003 setup
# notes for how to populate it. chmod 600 recommended so only the docker
# daemon / compose user can read it.
secrets:
  slack_webhook_url:
    file: ./secrets/slack_webhook_url.txt

networks:
  default:
    driver: overlay
    attachable: true
