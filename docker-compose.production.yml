# Production overlay for single-host docker compose up.
#
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
#
# Deployment target: single host. Swarm-only directives (placement
# constraints, replicas, overlay networks) are intentionally not used —
# they're no-ops under `docker compose up` and would mislead readers. To
# scale workers on a single host, use `--scale celery_worker=N` instead
# of `replicas`.
#
# What this overlay does on top of the dev base:
#  - flips FLASK_ENV/DEBUG to production for business_app
#  - tightens FLOWER_BASIC_AUTH from optional to required
#  - bumps resource limits and gunicorn / celery worker counts
#  - adds production tuning for postgres (pg_stat_statements, WAL, logging)
#    and redis (snapshot policy, memory cap, optional auth)
#  - sets PROMETHEUS_MULTIPROC_DIR for gunicorn workers' shared metrics
#  - adds the monitoring stack (prometheus, alertmanager, grafana, loki)
#    on 127.0.0.1 — access via SSH tunnel
#
# All host-bound ports inherited from the base file are 127.0.0.1-only,
# so traffic enters through nginx (port 81) and the rest stays local to
# the host.

services:
  postgres:
    environment:
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
      -c log_destination=stderr
      -c logging_collector=on
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
      -c log_statement=ddl
      -c log_temp_files=0
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  redis:
    # REDIS_PASSWORD is optional — leave empty to run without auth, or set
    # it in .env to require a password. If you set it, also include the
    # password in REDIS_URL for every consuming service.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-keepalive 60
      --timeout 300
      --tcp-backlog 511
      --databases 16
      --stop-writes-on-bgsave-error yes
      --rdbcompression yes
      --rdbchecksum yes
      --requirepass ${REDIS_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  business_app:
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - GUNICORN_WORKERS=4
      - GUNICORN_THREADS=2
      - GUNICORN_MAX_REQUESTS=2000
      - GUNICORN_MAX_REQUESTS_JITTER=200
      - GUNICORN_WORKER_CONNECTIONS=1000
      - GUNICORN_TIMEOUT=60
      - GUNICORN_KEEPALIVE=10
      # INF-003: prometheus_client multiprocess shared dir (must be writable
      # by every worker; ephemeral tmpfs is ideal — counters are re-derived
      # on boot).
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prom-multiproc
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 32768
        hard: 32768

  telegram_bot:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  celery_worker:
    environment:
      # Force production regardless of what .env says — celery imports
      # business_app code, so this needs to match business_app above.
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - CELERY_WORKER_CONCURRENCY=8
      - CELERY_WORKER_MAX_MEMORY_PER_CHILD=500000
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=1000
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    command: >
      celery -A business_app.tasks.celery_app worker
      -E
      --loglevel=info
      -Q celery,payment,notifications,delivery,analytics,subscriptions,orders,maintenance,loyalty
      --concurrency=8
      --max-memory-per-child=500000
      --max-tasks-per-child=1000
      --optimization=fair
      --prefetch-multiplier=1

  celery_beat:
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  flower:
    environment:
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:?FLOWER_BASIC_AUTH must be set, e.g. admin:somelongpassword}

  celery_exporter:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  admin_ui:
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-https://aqua-element.uz/api/v1}
      - REACT_APP_ENVIRONMENT=${ENVIRONMENT:-production}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - alertmanager
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # INF-003: Alertmanager routes Prometheus alerts to Slack. The webhook
  # URL is loaded via Compose file-mount secret at
  # /run/secrets/slack_webhook_url — see monitoring/alertmanager.yml.
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - slack_webhook_url
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address='  # single-node; disable gossip to avoid warning spam
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      # Grafana is now public at https://grafana.aqua-element.uz so the
      # admin password is a hard requirement (no `:-admin` default). Also
      # disable signups + anonymous access; the only login is admin (or
      # users created via the UI by admin).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}
      - GF_SERVER_ROOT_URL=https://grafana.aqua-element.uz
      - GF_SERVER_DOMAIN=grafana.aqua-element.uz
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MON-SUB-01: postgres_exporter. Replaces the broken `postgres:5432`
  # direct-scrape job in monitoring/prometheus.yml (Postgres speaks RESP, not
  # HTTP, and rejects HTTP scrapes as a "Possible SECURITY ATTACK").
  # Connects via a dedicated `monitoring_ro` role with pg_monitor membership;
  # password lives in secrets/postgres_monitoring_password and is read by the
  # exporter via DATA_SOURCE_PASS_FILE (no plaintext in env).
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_URI=postgres:5432/${POSTGRES_DB:-bluestream_db}?sslmode=disable
      - DATA_SOURCE_USER=monitoring_ro
      - DATA_SOURCE_PASS_FILE=/run/secrets/postgres_monitoring_password
    secrets:
      - postgres_monitoring_password
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MON-SUB-02: node_exporter. Host-level CPU/mem/disk/network metrics.
  # Required by Grafana dashboard 1860 (Node Exporter Full).
  # Uses bind mounts (not network_mode: host) so we stay on the bridge with
  # everyone else; --path.rootfs=/host points the collectors at the host fs.
  node_exporter:
    image: prom/node-exporter:latest
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    pid: host
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MON-SUB-03: cAdvisor. Per-container CPU/mem/network metrics. Required by
  # Grafana dashboard 21154 (Docker overview, 2024 build).
  # privileged: false but with cap_add + devices so it can read the cgroup
  # data it needs without a full --privileged.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--store_container_labels=false'
      - '--whitelisted_container_labels=com.docker.compose.service'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    cap_add:
      - SYS_PTRACE
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.1'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MON-SUB-04: nginx-prometheus-exporter. Scrapes the stub_status endpoint
  # exposed at http://nginx:80/nginx_status (see
  # nginx/conf.d/sites/00-stub-status.conf — locked down to the docker bridge
  # network). Required by dashboard 12708.
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command:
      - '--nginx.scrape-uri=http://nginx:80/nginx_status'
    depends_on:
      nginx:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.05'
        reservations:
          memory: 16M
          cpus: '0.02'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:latest
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana Alloy: log shipper that tails every Docker container's stdout
  # plus the nginx access/error files and pushes to Loki. Picked over
  # Promtail because the team's monitoring direction (see comment in
  # monitoring/grafana/datasources/datasources.yml header) is OTel — Alloy
  # is the OTel-compatible successor and lets us add traces + metrics
  # collection later without swapping agents.
  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      # Alloy UI: shows pipeline state, component health, target lists.
      # Bind to localhost only — same convention as prometheus/loki/etc.
      - "127.0.0.1:12345:12345"
    volumes:
      # Pipeline config (see monitoring/alloy/config.alloy for the
      # commented walk-through of each component).
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Docker socket: needed by discovery.docker + loki.source.docker.
      # Read-only — Alloy only enumerates / streams logs, never executes.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Nginx files: bind-mounted host dir (same one nginx writes to).
      # Read-only — Alloy is a tail-er, not a rotator.
      - ./logs/nginx:/var/log/nginx:ro
      # State directory (file-tail positions so we don't re-ship the whole
      # access.log on every restart).
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  alloy_data:

# File-mount secrets for plain Docker Compose (non-Swarm). Each file must
# exist before `docker compose up` — see docs/monitoring_subdomains.md and
# the INF-003 setup notes for how to populate them. chmod 600 recommended.
secrets:
  # INF-003: Alertmanager Slack receiver credential.
  slack_webhook_url:
    file: ./secrets/slack_webhook_url.txt
  # MON-SUB-01: postgres_exporter login for the read-only `monitoring_ro`
  # role. Generate via `scripts/manage-secrets.sh create postgres_monitoring_password`
  # then run monitoring/postgres/init-monitoring-role.sql to create the role
  # in Postgres with this password.
  postgres_monitoring_password:
    file: ./secrets/postgres_monitoring_password
