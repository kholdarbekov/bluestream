# Docker Compose with Secrets Management
# Use this for production deployments with Docker Swarm
version: '3.8'

x-common-secrets: &common-secrets
  - postgres_password
  - secret_key
  - telegram_bot_token
  - payme_secret_key
  - click_secret_key
  - sendgrid_api_key
  - twilio_auth_token
  - google_maps_api_key
  - yandex_maps_api_key
  - aws_secret_access_key
  - encryption_key

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bluestream_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - postgres_data_new:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bluestream_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    secrets:
      - redis_password
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$(cat /run/secrets/redis_password)", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server /etc/redis/redis.conf --requirepass "$(cat /run/secrets/redis_password)"

  business_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: business_app
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - POSTGRES_DB=${POSTGRES_DB:-bluestream_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PAYME_MERCHANT_ID=${PAYME_MERCHANT_ID}
      - CLICK_MERCHANT_ID=${CLICK_MERCHANT_ID}
      - CLICK_SERVICE_ID=${CLICK_SERVICE_ID}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - MAPS_PROVIDER=${MAPS_PROVIDER:-google}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_WORKER_CONNECTIONS=${GUNICORN_WORKER_CONNECTIONS:-1000}
      - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-1000}
      - GUNICORN_MAX_REQUESTS_JITTER=${GUNICORN_MAX_REQUESTS_JITTER:-100}
      # Secrets will be loaded from files
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - TELEGRAM_BOT_TOKEN_FILE=/run/secrets/telegram_bot_token
      - PAYME_SECRET_KEY_FILE=/run/secrets/payme_secret_key
      - CLICK_SECRET_KEY_FILE=/run/secrets/click_secret_key
      - SENDGRID_API_KEY_FILE=/run/secrets/sendgrid_api_key
      - TWILIO_AUTH_TOKEN_FILE=/run/secrets/twilio_auth_token
      - GOOGLE_MAPS_API_KEY_FILE=/run/secrets/google_maps_api_key
      - YANDEX_MAPS_API_KEY_FILE=/run/secrets/yandex_maps_api_key
      - AWS_SECRET_ACCESS_KEY_FILE=/run/secrets/aws_secret_access_key
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    secrets: *common-secrets
    volumes:
      - ./business_app:/app/business_app
      - ./shared:/app/shared
      - uploads_data:/app/uploads
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:5000:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: telegram_bot
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bluestream_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=1
      - BUSINESS_APP_URL=http://business_app:80
      # Secrets will be loaded from files
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - TELEGRAM_BOT_TOKEN_FILE=/run/secrets/telegram_bot_token
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    secrets:
      - postgres_password
      - telegram_bot_token
      - redis_password
    volumes:
      - ./telegram_bot:/app/telegram_bot
      - ./shared:/app/shared
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      business_app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://business_app:80/health'); exit(0 if r.status_code == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: celery_worker
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bluestream_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PAYME_MERCHANT_ID=${PAYME_MERCHANT_ID}
      - CLICK_MERCHANT_ID=${CLICK_MERCHANT_ID}
      - CLICK_SERVICE_ID=${CLICK_SERVICE_ID}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_CONCURRENCY:-4}
      - CELERY_WORKER_MAX_MEMORY_PER_CHILD=${CELERY_WORKER_MAX_MEMORY_PER_CHILD:-200000}
      # Secrets will be loaded from files
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - PAYME_SECRET_KEY_FILE=/run/secrets/payme_secret_key
      - CLICK_SECRET_KEY_FILE=/run/secrets/click_secret_key
      - SENDGRID_API_KEY_FILE=/run/secrets/sendgrid_api_key
      - TWILIO_AUTH_TOKEN_FILE=/run/secrets/twilio_auth_token
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    secrets:
      - secret_key
      - postgres_password
      - payme_secret_key
      - click_secret_key
      - sendgrid_api_key
      - twilio_auth_token
      - redis_password
    volumes:
      - ./business_app:/app/business_app
      - ./shared:/app/shared
      - uploads_data:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A business_app.tasks.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-4} --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD:-200000}
    healthcheck:
      test: ["CMD", "celery", "-A", "business_app.tasks.celery_app", "status"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: celery_beat
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bluestream_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      # Secrets will be loaded from files
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    secrets:
      - secret_key
      - postgres_password
      - redis_password
    volumes:
      - ./business_app:/app/business_app
      - ./shared:/app/shared
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A business_app.tasks.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep 'celery.*beat' | grep -v grep || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin_ui:
    build:
      context: ./admin_ui
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - REACT_APP_ENVIRONMENT=${ENVIRONMENT:-production}
      - REACT_APP_APP_NAME=Blue Stream Admin
      - REACT_APP_VERSION=1.0.0
    depends_on:
      business_app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  postgres_password:
    external: true
    name: bluestream_postgres_password
  secret_key:
    external: true
    name: bluestream_secret_key
  telegram_bot_token:
    external: true
    name: bluestream_telegram_bot_token
  payme_secret_key:
    external: true
    name: bluestream_payme_secret_key
  click_secret_key:
    external: true
    name: bluestream_click_secret_key
  sendgrid_api_key:
    external: true
    name: bluestream_sendgrid_api_key
  twilio_auth_token:
    external: true
    name: bluestream_twilio_auth_token
  google_maps_api_key:
    external: true
    name: bluestream_google_maps_api_key
  yandex_maps_api_key:
    external: true
    name: bluestream_yandex_maps_api_key
  aws_secret_access_key:
    external: true
    name: bluestream_aws_secret_access_key
  encryption_key:
    external: true
    name: bluestream_encryption_key
  redis_password:
    external: true
    name: bluestream_redis_password

volumes:
  postgres_data:
  postgres_data_new:
  redis_data:
  uploads_data:

networks:
  default:
    driver: bridge
