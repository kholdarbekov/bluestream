# Local development stack.
#
#   docker compose up -d --build
#
# Internal-service ports (Postgres, Redis, debugpy, Flower, business_app
# direct, admin_ui direct) are bound to 127.0.0.1 so they're reachable
# from your machine but never publicly exposed — the production overlay
# inherits these bindings, so on a server they stay safely localhost-only
# and traffic enters through nginx (port 81).
#
# Production overlay: docker-compose.production.yml
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bluestream_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dummy_password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data_new:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bluestream_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "--no-auth-warning", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}

  # ARCH-006 follow-up: schema bootstrap as a one-shot init container.
  # Replaces the in-line `flask db upgrade` that previously ran inside
  # `start-gunicorn.sh` — that path crashed on import because `flask` CLI
  # invocations don't get the prometheus multiproc-dir setup that
  # gunicorn.conf.py does, so migrations were silently being skipped.
  #
  # This service applies pending Alembic migrations and exits. Every
  # DB-consuming service waits on `service_completed_successfully`, so they
  # only boot against an up-to-date schema and a real migration failure now
  # blocks rollout (instead of being swallowed by the entrypoint warning).
  #
  # PROMETHEUS_MULTIPROC_DIR is unset in the command (not the environment —
  # prometheus_client checks key presence, not value) so the metrics module's
  # import-time mmap allocation falls back to in-process MutexValue storage.
  # No /tmp/prom-multiproc/ side-effects, no stale per-PID files left behind
  # for gunicorn workers to inherit.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: business_app
    command:
      - sh
      - -c
      - 'unset PROMETHEUS_MULTIPROC_DIR && exec flask db upgrade'
    environment:
      - TZ=${DISPLAY_TIMEZONE:-Asia/Tashkent}
      - FLASK_APP=business_app:create_app
      - FLASK_ENV=${FLASK_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dummy_password}@postgres:5432/${POSTGRES_DB:-bluestream_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - USE_SECRETS_FALLBACK=true
    env_file:
      - .env
    volumes:
      - ./business_app:/app/business_app
      - ./shared:/app/shared
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  business_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: business_app
    environment:
      - TZ=${DISPLAY_TIMEZONE:-Asia/Tashkent}
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_DEBUG=${FLASK_DEBUG:-1}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dummy_password}@postgres:5432/${POSTGRES_DB:-bluestream_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - USE_SECRETS_FALLBACK=true
      - PAYME_MERCHANT_ID=${PAYME_MERCHANT_ID}
      - PAYME_SECRET_KEY=${PAYME_SECRET_KEY}
      - CLICK_MERCHANT_ID=${CLICK_MERCHANT_ID}
      - CLICK_SERVICE_ID=${CLICK_SERVICE_ID}
      - CLICK_SECRET_KEY=${CLICK_SECRET_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - YANDEX_MAPS_API_KEY=${YANDEX_MAPS_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - MAPS_PROVIDER=${MAPS_PROVIDER:-google}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-http://osrm:5000}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - ESKIZ_EMAIL=${ESKIZ_EMAIL}
      - ESKIZ_PASSWORD=${ESKIZ_PASSWORD}
      - ESKIZ_FROM=${ESKIZ_FROM:-4546}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_WORKER_CONNECTIONS=${GUNICORN_WORKER_CONNECTIONS:-1000}
      - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-1000}
      - GUNICORN_MAX_REQUESTS_JITTER=${GUNICORN_MAX_REQUESTS_JITTER:-100}
      - GUNICORN_GRACEFUL_TIMEOUT=${GUNICORN_GRACEFUL_TIMEOUT:-30}
    env_file:
      - .env
    volumes:
      - ./business_app:/app/business_app
      - ./shared:/app/shared
      - uploads_data:/app/uploads
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:5000:80"
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: telegram_bot
    environment:
      - TZ=${DISPLAY_TIMEZONE:-Asia/Tashkent}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dummy_password}@postgres:5432/${POSTGRES_DB:-bluestream_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # BOT_WEBHOOK_SECRET (not WEBHOOK_SECRET) is the customer-bot ↔ backend
      # contract — see telegram_bot/config.py and business_app/config/base.py.
      # Distinct from staff_bot's WEBHOOK_SECRET below: two bots, two trust
      # domains, two independent secrets. Keep both entries here so an
      # operator running `docker compose config` sees the contract clearly.
      - BOT_WEBHOOK_SECRET=${BOT_WEBHOOK_SECRET:-}
      - USE_SECRETS_FALLBACK=true
      # - WEBHOOK_URL=${WEBHOOK_URL}
      # - BUSINESS_APP_URL=http://business_app:80
    env_file:
      - .env
    volumes:
      - ./telegram_bot:/app/telegram_bot
      - ./shared:/app/shared
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:5679:5679"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      business_app:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; r = requests.get('http://business_app:80/health'); exit(0 if r.status_code == 200 else 1)" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  staff_bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: staff_bot
    container_name: bluestream_staff_bot
    environment:
      - TZ=${DISPLAY_TIMEZONE:-Asia/Tashkent}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dummy_password}@postgres:5432/${POSTGRES_DB:-bluestream_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/2
      - STAFF_BOT_TOKEN=${STAFF_BOT_TOKEN:-}
      - STAFF_TELEGRAM_BOT_TOKEN=${STAFF_TELEGRAM_BOT_TOKEN}
      - STAFF_BOT_MODE=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - USE_SECRETS_FALLBACK=true
      - STAFF_WEBHOOK_SERVER_PORT=8081
    env_file:
      - .env
    volumes:
      - ./staff_bot:/app/staff_bot
      - ./shared:/app/shared
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      business_app:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8081/health'); exit(0 if r.status_code == 200 else 1)" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: celery_worker
    environment:
      - TZ=${DISPLAY_TIMEZONE:-Asia/Tashkent}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dummy_password}@postgres:5432/${POSTGRES_DB:-bluestream_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - USE_SECRETS_FALLBACK=true
      - PAYME_MERCHANT_ID=${PAYME_MERCHANT_ID}
      - PAYME_SECRET_KEY=${PAYME_SECRET_KEY}
      - CLICK_MERCHANT_ID=${CLICK_MERCHANT_ID}
      - CLICK_SERVICE_ID=${CLICK_SERVICE_ID}
      - CLICK_SECRET_KEY=${CLICK_SECRET_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_CONCURRENCY:-4}
      - CELERY_WORKER_MAX_MEMORY_PER_CHILD=${CELERY_WORKER_MAX_MEMORY_PER_CHILD:-200000}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-http://osrm:5000}
      # INF-008: backup destinations. Override BACKUP_RCLONE_REMOTE in
      # production env to enable offsite copies.
      - BACKUP_LOCAL_DIR=${BACKUP_LOCAL_DIR:-/var/backups/bluestream}
      - BACKUP_LOCAL_RETENTION_DAYS=${BACKUP_LOCAL_RETENTION_DAYS:-14}
      - BACKUP_RCLONE_REMOTE=${BACKUP_RCLONE_REMOTE:-}
      - BACKUP_OFFSITE_RETENTION_DAYS_DB=${BACKUP_OFFSITE_RETENTION_DAYS_DB:-90}
      - BACKUP_OFFSITE_RETENTION_DAYS_UPLOADS=${BACKUP_OFFSITE_RETENTION_DAYS_UPLOADS:-365}
    env_file:
      - .env
    volumes:
      - ./business_app:/app/business_app
      - ./shared:/app/shared
      - uploads_data:/app/uploads
      - ./logs:/app/logs
      # INF-008: backup output dir. Mounted as a named volume so backups
      # survive container restarts/rebuilds. In production, replace this with
      # a host-mount onto a separately-snapshotted disk.
      - backup_data:/var/backups/bluestream
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # CEL-006: `-E` enables task lifecycle events so Flower and the
    # celery-exporter can observe started/succeeded/failed/retried transitions.
    command: celery -A business_app.tasks.celery_app worker -E --loglevel=info -Q celery,payment,notifications,delivery,analytics,subscriptions,orders,maintenance,loyalty --concurrency=${CELERY_WORKER_CONCURRENCY:-4} --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD:-200000} --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-1000}
    healthcheck:
      test: [ "CMD", "celery", "-A", "business_app.tasks.celery_app", "status" ]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: celery_beat
    environment:
      - TZ=${DISPLAY_TIMEZONE:-Asia/Tashkent}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dummy_password}@postgres:5432/${POSTGRES_DB:-bluestream_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - USE_SECRETS_FALLBACK=true
    env_file:
      - .env
    volumes:
      - ./business_app:/app/business_app
      - ./shared:/app/shared
      - ./logs:/app/logs
      - celerybeat_schedule:/app/celerybeat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A business_app.tasks.celery_app beat --loglevel=info --schedule=/app/celerybeat/celerybeat-schedule -S business_app.tasks.db_scheduler:DBBackedScheduler
    healthcheck:
      # test: [ "CMD", "sh", "-c", "ps aux | grep 'celery.*beat' | grep -v grep || exit 1" ]
      test: ["CMD-SHELL", "find /app/celerybeat/celerybeat-schedule* -mmin -10 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # CEL-006: Flower dashboard for Celery (queues, workers, task history).
  # In dev, exposed on 127.0.0.1:5555 with a default basic-auth credential
  # so `docker compose up` works without setting FLOWER_BASIC_AUTH. The
  # production overlay tightens this — FLOWER_BASIC_AUTH becomes required.
  flower:
    image: mher/flower:2.0
    environment:
      - TZ=${DISPLAY_TIMEZONE:-Asia/Tashkent}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:-admin:devpassword}
      - FLOWER_PERSISTENT=True
      - FLOWER_DB=/data/flower.db
      - FLOWER_STATE_SAVE_INTERVAL=60000
      - FLOWER_PURGE_OFFLINE_WORKERS=3600
    command: celery --broker=redis://:${REDIS_PASSWORD:-}@redis:6379/0 flower --persistent=True --db=/data/flower.db --port=5555
    volumes:
      - flower_data:/data
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- --user=$$(echo $$FLOWER_BASIC_AUTH | cut -d: -f1) --password=$$(echo $$FLOWER_BASIC_AUTH | cut -d: -f2) http://localhost:5555/healthcheck || exit 1" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # CEL-006: Prometheus exporter for Celery (danihodovic/celery-exporter).
  # Consumes the worker event stream (enabled via `-E` on celery_worker) and
  # exposes Prometheus metrics on :9540. Scraped by Prometheus job `celery`
  # in the production overlay.
  celery_exporter:
    image: minervaproject/celery-exporter:26.5.1
    environment:
      - TZ=${DISPLAY_TIMEZONE:-Asia/Tashkent}
      - CE_BROKER_URL=${REDIS_URL}
      - CE_LOG_LEVEL=INFO
    command:
      - --broker-url=${REDIS_URL}
      - --port=9540
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    healthcheck:
      # minervaproject/celery-exporter ships no wget/curl (distroless-ish python
      # image), so the old `wget` probe always failed → container stuck
      # "unhealthy" even though metrics on :9540 were fine. That masked real
      # exporter outages. Probe /health with the python that ships in the image.
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9540/health', timeout=5).status == 200 else 1)" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus exporter for Redis (oliver006/redis_exporter). Translates
  # Redis RESP into Prometheus metrics on :9121. Scraped by the `redis` job
  # in monitoring/prometheus.yml. Without this, Prometheus would scrape
  # redis:6379 directly over HTTP, which Redis aborts as cross-protocol
  # scripting and logs as a "Possible SECURITY ATTACK".
  redis_exporter:
    image: oliver006/redis_exporter:v1.86.0
    environment:
      - TZ=${DISPLAY_TIMEZONE:-Asia/Tashkent}
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9121/health || exit 1" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin_ui:
    build:
      context: ./admin_ui
      dockerfile: Dockerfile
      args:
        # Same-origin API path. Override per-environment by exporting
        # VITE_API_URL before `docker compose build admin_ui` (e.g. for
        # staging that hits a different host). See admin_ui/Dockerfile for
        # the rationale.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports:
      - "127.0.0.1:3000:80"
    environment:
      # `REACT_APP_*` env vars were a Create-React-App leftover and are
      # never read by the Vite bundle; the only build-time value that
      # actually reaches the JS is `VITE_API_URL` above. Runtime vars below
      # are kept for any future server-side use by the admin_ui nginx.
      - REACT_APP_ENVIRONMENT=${ENVIRONMENT:-development}
      - REACT_APP_TIMEZONE_OFFSET=${DISPLAY_TIMEZONE_OFFSET:-+05:00}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "81:80"
    environment:
      # MON-SUB: credential for prometheus/loki/alertmanager subdomains.
      # Format: user:password (same shape as FLOWER_BASIC_AUTH). Consumed
      # by /docker-entrypoint.d/40-monitoring-htpasswd.sh at container
      # start, which writes a plaintext htpasswd file to a container-only
      # path — nothing reaches the host. Update by editing .env and
      # `docker compose up -d --force-recreate nginx`.
      - MONITORING_BASIC_AUTH=${MONITORING_BASIC_AUTH:-}
    volumes:
      # Main nginx config
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Modular configs
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Static files from Flask app
      - ./business_app/static:/var/www/static:ro
      # Uploaded files
      - uploads_data:/var/www/uploads:ro
      # Nginx cache directory
      - nginx_cache:/var/cache/nginx
      # Logs
      - ./logs/nginx:/var/log/nginx
      # MON-SUB: entrypoint script that materialises the htpasswd file from
      # MONITORING_BASIC_AUTH at container start (see comment on the env
      # var above). The official nginx-alpine entrypoint auto-runs every
      # executable in /docker-entrypoint.d/ before launching nginx -g.
      - ./nginx/docker-entrypoint.d/40-monitoring-htpasswd.sh:/docker-entrypoint.d/40-monitoring-htpasswd.sh:ro
    depends_on:
      business_app:
        condition: service_healthy
      admin_ui:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Self-hosted OSRM — primary distance-matrix provider (route UX phase 2).
  # Profile-gated: does nothing on a plain `docker compose up`. Enable with
  # COMPOSE_PROFILES=routing in .env (prod) or `--profile routing` (dev).
  # Data is prepared OFF this host by scripts/prepare_osrm_data.sh and
  # mounted read-only; --mmap keeps resident memory low on the Pi.
  #
  # --max-table-size MUST be explicit: default is 100. The rule below was
  # EMPIRICALLY VERIFIED against v5.27.1 with real prepared data on
  # 2026-08-12 (see task-1-report.md for the probe log), and re-confirmed at
  # SOURCE level for v26.8.0 on 2026-08-13: src/engine/plugins/table.cpp is
  # byte-identical between the two tags, so the rule is version-independent
  # across this upgrade rather than a property of one binary. The rule is:
  # reject iff (sources × destinations) > (max-table-size)². Boundary
  # confirmed to sit at exactly M² across three flag values: at M=10,
  # 2 sources x 50 destinations = 100 cells -> Ok, 2x51 = 102 cells ->
  # TooBig; at M=100 (default), N=100 (symmetric) -> Ok, N=101 -> TooBig;
  # at M=1000, N=1000 -> Ok, N=1001 -> TooBig, and 1 source x 2000
  # destinations (2000 cells, well under 1000²) -> Ok. It is NOT a
  # per-axis cap and NOT a raw-coordinate-count cap in general — those
  # were both tried and falsified by the M=10 pair above (a per-axis cap
  # of 10 predicts TooBig for both 2x50 and 2x51; only the product boundary
  # explains the split). For our real usage — one coordinate list, no
  # explicit sources=/destinations=, so sources=destinations=N — this
  # degenerates to N² > M², i.e. plain N > M. 1000 comfortably covers our
  # worst case of 16 coordinates (15 stops + origin) with vast headroom,
  # but also permits a much larger 1000x1000 = 1,000,000-cell table if a
  # future caller ever passes asymmetric sources/destinations.
  # The image tag MUST match OSRM_IMAGE in scripts/prepare_osrm_data.sh —
  # the data fingerprint embeds the OSRM version.
  #
  # NOTE THE `-debian` SUFFIX: upstream no longer publishes bare `vX.Y.Z`
  # image tags (`:v26.8.0` -> MANIFEST_UNKNOWN). `-debian` is the multi-arch
  # tag (linux/amd64 + linux/arm64, so the Pi 5 is covered); Alpine variants
  # were dropped in v26.7.0.
  #
  # UPGRADE POLICY: from the v26 CalVer series upstream declares datasets
  # incompatible across EVERY monthly release — only same-month patch bumps
  # keep prepared data loadable. So bumping this tag is never just an edit:
  # it requires re-running scripts/prepare_osrm_data.sh off-Pi and re-shipping
  # ~1 GB. Pin deliberately; do not chase `latest`.
  #
  # We keep ALL feature datasets loaded (no --disable-feature-dataset).
  # ROUTE_GEOMETRY/ROUTE_STEPS are not dead weight here: they are what lets
  # this instance also answer /route with real road geometry for the admin
  # dispatch map (business_app/api/admin_dispatch.py::dispatch_route_geometry),
  # which today goes to a paid provider or the public demo server. Disabling
  # ROUTE_GEOMETRY additionally breaks /table unless every caller passes
  # skip_waypoints=true — verified 2026-08-13: the server starts clean and
  # then fails at QUERY time with code "DisabledDataset" (StringData).
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.8.0-debian
    profiles: ["routing"]
    command: osrm-routed --algorithm mld --mmap --max-table-size 1000 /data/uzbekistan-latest.osrm
    volumes:
      - ./osrm_data:/data:ro
    ports:
      - "127.0.0.1:5001:5000"
    healthcheck:
      # The image ships no curl/wget; probe the TCP port with bash.
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/5000' || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  postgres_data_new:
  redis_data:
  uploads_data:
  # INF-008: backup output. In production, replace with a host-mount onto a
  # separately-managed disk (and snapshot it independently of the main app
  # volume). Keeping it as a named volume in dev so `docker compose down -v`
  # doesn't drag the user-uploads volume with it.
  backup_data:
  nginx_cache:
  celerybeat_schedule:
  # CEL-006: persists Flower task history across container restarts.
  flower_data:


networks:
  default:
    driver: bridge
