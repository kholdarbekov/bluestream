groups:
  - name: bluestream_alerts
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: rate(cpu_usage_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 5 minutes"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (memory_usage_bytes / memory_limit_bytes) > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 90% for more than 2 minutes"

      # Database connection issues
      - alert: DatabaseConnectionIssues
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database is down"
          description: "PostgreSQL database is not responding"

      # Redis connection issues
      - alert: RedisConnectionIssues
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis cache server is not responding"

      # Application health check failures
      - alert: ApplicationDown
        expr: up{job="business_app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Business application is down"
          description: "Main business application is not responding to health checks"

      # Flask 5xx error ratio. Replaces an earlier alert that referenced a
      # nonexistent `http_requests_total` metric (silent for the lifetime of
      # the project). The real series comes from prometheus_flask_exporter
      # with prefix `flask` — see business_app/utils/prometheus_metrics.py.
      # Note: nginx-level 5xx (e.g. rate-limit 503s) never reach Flask, so
      # those are covered separately by the Loki ruler in monitoring/loki/rules.
      - alert: FlaskHighErrorRate
        expr: |
          sum(rate(flask_http_request_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(flask_http_request_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
          area: backend
        annotations:
          summary: "Flask 5xx rate > 5% (5m)"
          description: "Flask error ratio sustained above 5% over the last 5 minutes — investigate worker logs and recent deploys."

      # Disk space usage
      - alert: DiskSpaceUsage
        expr: (disk_used_bytes / disk_total_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage"
          description: "Disk usage is above 85%"

      # CEL-006: Celery queue backup. Metric supplied by danihodovic/celery-exporter.
      - alert: CeleryQueueBackup
        expr: celery_queue_length > 1000
        for: 10m
        labels:
          severity: warning
          area: celery
        annotations:
          summary: "Celery queue backup ({{ $labels.queue_name }})"
          description: "Queue {{ $labels.queue_name }} has more than 1000 pending tasks for 10m. Check worker capacity, broker connectivity, or a stuck task slot."

      # CEL-006: Failed-task ratio over 10m. Catches deploy-time bugs and
      # downstream outages (e.g., payment gateway / Telegram API failures).
      - alert: CeleryTaskFailureRateHigh
        expr: |
          (
            sum(rate(celery_task_failed_total[10m]))
            /
            clamp_min(sum(rate(celery_task_sent_total[10m])), 1)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          area: celery
        annotations:
          summary: "Celery task failure rate > 5%"
          description: "More than 5% of Celery tasks are failing over a 10m window. Check worker logs and recent deploys."

      # CEL-006: Tasks running longer than 30 minutes. p95 runtime threshold;
      # most BlueStream tasks complete in seconds — anything sustained at 30m+
      # is likely a hung worker, deadlocked DB call, or runaway loop.
      - alert: CeleryTaskStuck
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, name) (rate(celery_task_runtime_seconds_bucket[15m]))
          ) > 1800
        for: 5m
        labels:
          severity: warning
          area: celery
        annotations:
          summary: "Celery task {{ $labels.name }} stuck (p95 runtime > 30m)"
          description: "Task {{ $labels.name }} p95 runtime exceeded 30 minutes over a 15m window. Inspect worker for hung threads / blocking I/O."

      # INF-008: nightly DB backup health. The backup itself (pg_dump) rarely
      # fails — the usual culprit is the offsite copy to Google Drive (rclone).
      # A 2026-06 outage went unnoticed for 4 days: the Google OAuth consent
      # screen was in "Testing" status, so the refresh token expired after 7
      # days and every `rclone copyto` failed with `invalid_grant`. These two
      # alerts close that blind spot. `name="backup.database"` is the custom
      # task name from @shared_task(name=...); metrics via danihodovic/celery-exporter.
      - alert: DatabaseBackupFailing
        expr: increase(celery_task_failed_total{name="backup.database"}[2h]) > 0
        for: 5m
        labels:
          severity: critical
          area: backups
        annotations:
          summary: "Nightly DB backup is failing"
          description: "backup.database recorded task failures in the last 2h. Check celery_worker logs for the rclone stderr. Likely the offsite Google Drive copy — note a 'Testing'-status OAuth consent screen expires the refresh token after 7 days (re-publish to production + re-auth)."

      # Catches the other failure mode: beat stops sending the task at all (dead
      # celery_beat / schedule change), so it never even fails — it just goes
      # silent. `or vector(0)` makes the rule fire when the series is absent too.
      - alert: DatabaseBackupStale
        expr: (sum(increase(celery_task_succeeded_total{name="backup.database"}[26h])) or vector(0)) == 0
        for: 30m
        labels:
          severity: warning
          area: backups
        annotations:
          summary: "No successful DB backup in 26h"
          description: "backup.database has not succeeded in 26h (expected nightly at 02:30 Tashkent / 21:30 UTC). Check celery_beat schedule and celery_worker, and whether the rclone Google Drive token expired."

      # INF-003: business-critical alerts from the 2026-04 audit
      # Payment webhook failures: gateway callbacks dropping indicates lost revenue.
      - alert: PaymentWebhookFailureSpike
        expr: rate(payment_webhook_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          area: payments
        annotations:
          summary: "Payment webhook failure spike"
          description: "More than 10% of payment webhooks are failing over a 5m window — check gateway connectivity, signature verification, and idempotency cache."

      # DB pool saturation: app will start queuing/timing out requests.
      - alert: DBPoolSaturated
        expr: (pg_pool_in_use / pg_pool_size) > 0.9
        for: 5m
        labels:
          severity: critical
          area: backend
        annotations:
          summary: "Postgres connection pool saturated"
          description: "Pool utilisation > 90% for 5m — investigate long-running queries or raise pool size."

      # Stale PENDING payments: webhooks may have failed to land; orders frozen.
      # Pairs with PAY-007 (reconciliation beat) once implemented.
      - alert: StalePaymentsPending
        expr: payments_pending_age_seconds{quantile="0.95"} > 900
        for: 15m
        labels:
          severity: warning
          area: payments
        annotations:
          summary: "Stale PENDING payments"
          description: "p95 PENDING payment age > 15 minutes — check gateway status and reconcile."

      # Webhook idempotency hit rate too high = replay flood or misconfigured gateway.
      - alert: WebhookDuplicateFlood
        expr: rate(payment_webhook_duplicates_total[5m]) > rate(payment_webhook_total[5m]) * 0.5
        for: 10m
        labels:
          severity: warning
          area: payments
        annotations:
          summary: "Unusually high webhook duplicate rate"
          description: "More than half of incoming webhooks hit the idempotency guard — check for replay or gateway retry storm."
