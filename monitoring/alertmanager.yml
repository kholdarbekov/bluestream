# Alertmanager configuration for Aqua Element (INF-003).
#
# Routing:
#   severity=all  → Slack only
#
# Secret material is read from files mounted as Docker secrets (see
# [docker-compose.production.yml](../docker-compose.production.yml)):
#   /run/secrets/slack_webhook_url           — Slack incoming webhook
#
# To wire receivers in a new environment:
#   1. Create the three secrets above via `scripts/manage-secrets.sh` (or
#      docker secret create) and mount them into the alertmanager container.
#   2. Run `amtool check-config monitoring/alertmanager.yml` to validate.

global:
  resolve_timeout: 5m

route:
  receiver: 'slack-alerts' # default everything to Slack
  group_by: ['alertname', 'area']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'slack-alerts'
    slack_configs:
      - api_url_file: '/run/secrets/slack_webhook_url'
        channel: '#alerts-prod'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} ({{ .CommonLabels.area }})'
        text: |-
          {{ range .Alerts }}
          *{{ .Labels.severity | toUpper }}* — {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # If the whole app is down, suppress the downstream payment/backend alerts
  # so pages fire on the root cause, not the symptoms.
  - source_matchers:
      - alertname="ApplicationDown"
    target_matchers:
      - area="payments"
    equal: ['job']
  - source_matchers:
      - alertname="ApplicationDown"
    target_matchers:
      - area="backend"
    equal: ['job']
