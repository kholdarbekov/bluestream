apiVersion: 1

providers:
  - name: 'BlueStream'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      # MON-SUB: subdirectories under dashboards/ become folders in Grafana
      # (00-bluestream/ → "00 Bluestream", 10-host-and-docker/ → "10 Host And Docker", ...).
      # Numeric prefix controls sort order in the Dashboards sidebar.
      foldersFromFilesStructure: true
