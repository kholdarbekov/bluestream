# Grafana datasource provisioning (https://grafana.com/docs/grafana/latest/administration/provisioning/#datasources).
#
# All three datasources sit on the docker bridge network — proxy access only,
# no public exposure required from Grafana itself.
#
# editable: false freezes the connections so an admin can't accidentally
# repoint them to a wrong URL via the UI; edits go through this file.

apiVersion: 1

# Alertmanager is listed first so its UID exists in Grafana's datasource
# registry before anything that might cross-reference it (the Prometheus
# datasource used to declare `alertmanagerUid: alertmanager`, which races
# the Alertmanager being provisioned and fails Grafana startup with
# "Datasource provisioning error: data source not found"). The cross-ref
# isn't actually needed — Grafana's Alerting UI auto-discovers any
# alertmanager-typed datasource — so it's gone, but the order convention
# stays as defense against future re-additions.
datasources:
  # Lets Grafana's Alerting → Silences UI manage silences/inhibitions on
  # the same Alertmanager that backs alertmanager.aqua-element.uz.
  # handleGrafanaManagedAlerts:false defers all alert ownership to
  # Prometheus's alert_rules.yml (single source of truth for routes +
  # receivers).
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s

  # Loki: zero logs flowing in until the OTel migration plan lands a
  # collector / Promtail. Datasource is wired now so the dashboards in
  # 50-logs/ load without errors and start populating the moment ingest
  # starts (no Grafana redeploy needed).
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # Pulls the request_id label out of structured-log lines and turns it
      # into a clickable filter. Once Tempo lands (OTel Phase 1), add
      # `datasourceUid: tempo` here to make this a trace cross-link.
      derivedFields:
        - matcherRegex: 'request_id=([\w-]+)'
          name: RequestID
          url: '$${__value.raw}'
