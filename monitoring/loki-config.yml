auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# Schema v13 + tsdb index are required by Loki 3.x for Structured Metadata
# and native OTLP ingestion. Fresh deploy so no legacy `from:` entry needed —
# if you ever migrate an existing boltdb-shipper store, keep the old entry
# and add a new one with a future `from:` date instead of editing in-place.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# tsdb-shipper index locations (sibling to the filesystem chunk store above).
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

# Retain 30 days of logs — adjust to your retention policy.
limits_config:
  retention_period: 720h
  allow_structured_metadata: true

# In Loki 3.x, retention is enforced by the compactor — `retention_period`
# under `limits_config` above is a no-op until `retention_enabled: true` is
# set here. Without these three lines old chunks accumulate forever despite
# the 720h policy. `retention_delete_delay` is a safety window: chunks
# marked for deletion sit unreferenced for that long before the filesystem
# is touched, so an accidental policy change is recoverable for 2h.
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m

# Loki ruler — evaluates alert / recording rules against ingested logs and
# pushes firing alerts to Alertmanager. `alertmanager_url` uses the Compose
# service DNS name (single-host bridge network); `localhost` would be the
# Loki container itself.
#
# Rule files live on a read-only bind mount at /etc/loki/rules (see
# docker-compose.production.yml). With `auth_enabled: false`, the implicit
# tenant ID is `fake`, so rules go under /etc/loki/rules/fake/*.yml.
ruler:
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  enable_api: true
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /tmp/loki/rule-temp
  ring:
    kvstore:
      store: inmemory

# By default, Loki will send anonymous, but uniquely-identifiable usage and configuration
# analytics to Grafana Labs. These statistics are sent to https://stats.grafana.org/
#
# Statistics help us better understand how Loki is used, and they show us performance
# levels for most users. This helps us prioritize features and documentation.
# For more information on what's sent: https://github.com/grafana/loki/blob/main/pkg/usagestats/stats.go
# Refer to the buildReport method to see what goes into a report.
#
# If you would like to disable reporting, uncomment the following lines:
analytics:
  reporting_enabled: false
