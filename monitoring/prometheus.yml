global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Load alert/recording rules once and evaluate them per global evaluation_interval.
rule_files:
  - "alert_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'business_app'
    static_configs:
      - targets: ['business_app:80']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # MON-SUB-01: Scrape via postgres_exporter, not Postgres directly.
  # Job name kept as `postgres` so the DatabaseConnectionIssues alert
  # (`up{job="postgres"} == 0` in alert_rules.yml) keeps working.
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
    scrape_interval: 30s

  # Scrape redis_exporter (oliver006/redis_exporter), not redis directly:
  # Redis speaks RESP, not HTTP, and aborts HTTP scrapes with a "Possible
  # SECURITY ATTACK" log line. Job name stays `redis` so the
  # `up{job="redis"}` alert in alert_rules.yml keeps working.
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']
    scrape_interval: 30s

  # CEL-006: scrape danihodovic/celery-exporter on :9540. Replaces the legacy
  # celery_worker:5555 target (Flower's UI port — never exported metrics).
  - job_name: 'celery'
    static_configs:
      - targets: ['celery_exporter:9540']
    scrape_interval: 30s

  # MON-SUB-02: host-level metrics (CPU, memory, disk, network).
  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']
    scrape_interval: 30s

  # MON-SUB-03: per-container metrics. Drops the obsolete `docker` job that
  # tried to scrape host.docker.internal:9323 (only worked when the host
  # daemon's experimental metrics-addr was enabled).
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s

  # MON-SUB-04: nginx-prometheus-exporter scrapes /nginx_status (see
  # nginx/conf.d/sites/00-stub-status.conf, locked to docker bridge subnet).
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']
    scrape_interval: 30s

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
