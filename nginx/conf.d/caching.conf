# Caching Configuration

# Cache zones for proxy caching
proxy_cache_path /var/cache/nginx/proxy levels=1:2 keys_zone=proxy_cache:10m max_size=100m inactive=60m use_temp_path=off;

# Static file caching map based on content type
map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   1y;
    application/javascript     1y;
    application/json           epoch;
    ~image/                    1y;
    ~font/                     1y;
    application/x-font-ttf     1y;
    application/x-font-woff    1y;
    application/font-woff2     1y;
}
