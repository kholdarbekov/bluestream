# Security Headers Configuration
# Note: HSTS is handled by Cloudflare, SSL terminates at Cloudflare

# Content Security Policy map - varies by location context
map $uri $csp_policy {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://maps.googleapis.com https://api-maps.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.yandex.net; connect-src 'self' https://api.telegram.org https://maps.googleapis.com https://geocode-maps.yandex.ru; frame-ancestors 'self';";
}

# Permissions Policy map
map $uri $permissions_policy {
    default "geolocation=(self), microphone=(), camera=(), payment=(self), usb=()";
}

# Rate limiting zone for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
