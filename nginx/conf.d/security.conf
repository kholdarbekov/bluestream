# Security Headers Configuration
# Note: HSTS is handled by Cloudflare, SSL terminates at Cloudflare

# Content Security Policy map - varies by location context.
# INF-001 closed 2026-04-24: all public Jinja templates migrated to external JS
# files (see docs/audit/inf-001-inline-script-migration-plan.md). 'unsafe-inline'
# removed from script-src. 'unsafe-eval' already removed (no runtime eval usage).
# 'unsafe-inline' retained on style-src for now (inline styles still present in
# templates; separate follow-up if needed).
map $uri $csp_policy {
    default "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://maps.googleapis.com https://api-maps.yandex.ru https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.yandex.net https://*.tile.openstreetmap.org; connect-src 'self' https://api.telegram.org https://maps.googleapis.com https://geocode-maps.yandex.ru; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';";
}

# Permissions Policy map
map $uri $permissions_policy {
    default "geolocation=(self), microphone=(), camera=(), payment=(self), usb=()";
}

# Rate limiting zone for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=admin_api_limit:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
