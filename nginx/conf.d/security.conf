# Security Headers Configuration
# Note: HSTS is handled by Cloudflare, SSL terminates at Cloudflare

# Content Security Policy map - single source of truth for the public storefront
# (aqua-element.uz) and the customer cabinet (cabinet.aqua-element.uz). nginx owns
# this header; the upstream Flask app's CSP is stripped via `proxy_hide_header` in
# the site configs so the browser never receives two conflicting policies (a second
# CSP header is intersected, not merged, which silently breaks everything).
#
# INF-001 (2026-04-24) removed 'unsafe-inline' after migrating public templates to
# external JS, but the homepage still ships inline analytics/config blocks (gtag
# bootstrap) and Cloudflare may inject inline snippets, so 'unsafe-inline' is
# retained on script-src. Completing the inline-script migration to drop it again
# is tracked as a follow-up.
#
# Third-party origins:
#   - cdn.jsdelivr.net / unpkg.com .................. Leaflet + libs
#   - maps.googleapis.com / api-maps.yandex.ru ...... map widgets (scripts)
#   - geocode-maps.yandex.ru ........................ address geocoding (xhr)
#   - www.googletagmanager.com ...................... Google Analytics (gtag.js)
#   - *.google-analytics.com ........................ GA4 collect beacons (xhr)
#   - static.cloudflareinsights.com / cloudflareinsights.com .. Cloudflare Web Analytics
#   - www.youtube(-nocookie).com .................... video embeds (frames)
map $uri $csp_policy {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://maps.googleapis.com https://api-maps.yandex.ru https://unpkg.com https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.aqua-element.uz wss://aqua-element.uz wss://api.aqua-element.uz https://api.telegram.org https://maps.googleapis.com https://geocode-maps.yandex.ru https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://static.cloudflareinsights.com https://cloudflareinsights.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';";
}

# Permissions Policy map
map $uri $permissions_policy {
    default "geolocation=(self), microphone=(), camera=(), payment=(self), usb=()";
}

# Rate limiting zone for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=admin_api_limit:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
