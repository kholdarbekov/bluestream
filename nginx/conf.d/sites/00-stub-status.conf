# Stub status endpoint for nginx-prometheus-exporter (NGINX-PE-01).
#
# Listens on the default Docker bridge network only. The bridge subnet is
# 172.16.0.0/12 by default; we restrict access to that range so the host
# (which would appear as the gateway) and any leaked external client cannot
# scrape internal connection counters.
#
# nginx_exporter scrapes http://nginx:80/nginx_status — note this is on the
# *default* server (no Host header match), reached via the docker DNS name
# `nginx` from the exporter container. The `default_server` directive
# ensures requests without a matching server_name (the exporter sends
# Host: nginx) hit this block first.

server {
    listen 80 default_server;
    server_name _;

    # Lock down to internal Docker bridge network.
    location = /nginx_status {
        stub_status;
        access_log off;

        allow 127.0.0.0/8;
        allow 172.16.0.0/12;   # default docker bridge range
        allow 10.0.0.0/8;       # if the operator changes to a custom subnet
        deny all;
    }

    # nginx-level health check for any docker healthcheck targeting the
    # default vhost (e.g. `nginx -t` is already used, but this is cheaper).
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Anything else hitting the default vhost gets 444 (close connection).
    # Real traffic always carries a matching Host header for one of the
    # subdomain server blocks under sites/.
    location / {
        return 444;
    }
}
