# Admin Panel: admin.aqua-element.uz
# Serves: React Admin UI (proxied to admin_ui container)

server {
    listen 80;
    server_name admin.aqua-element.uz;

    set $upstream_business_app business_app;
    set $upstream_admin_ui admin_ui;

    # Strictest security headers for admin area
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # CSP — admin SPA has no inline scripts (Vite emits only external modules).
    # style-src keeps 'unsafe-inline' for Ant Design v5 CSS-in-JS runtime styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.aqua-element.uz https://*.tile.openstreetmap.org; connect-src 'self' https://aqua-element.uz; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Ensure crawlers do not index admin surfaces.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API proxy to Flask backend
    location /api/ {
        limit_req zone=admin_api_limit burst=120 nodelay;

        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        proxy_set_header Host aqua-element.uz;  # Use main domain for API
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # All other routes - proxy to admin_ui (React SPA with its own nginx)
    location / {
        proxy_pass http://$upstream_admin_ui:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
