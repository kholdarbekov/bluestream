# Alertmanager: alertmanager.aqua-element.uz
# Upstream: alertmanager:9093
#
# Auth: htpasswd (shared with prometheus + loki).
#
# Per https://prometheus.io/docs/operating/security/ — Alertmanager has no
# native auth, and any authenticated caller can create silences, modify
# inhibition rules, or fire test alerts that exit through the configured
# Slack receiver. The htpasswd in front is what makes this safe to expose.
#
# Grafana also has alertmanager as a datasource (see
# monitoring/grafana/datasources/datasources.yml) so silence management can
# happen via Grafana's Alerting UI on a different login surface.

server {
    listen 80;
    server_name alertmanager.aqua-element.uz;

    set $upstream_alertmanager alertmanager;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Block lifecycle endpoints (--web.enable-lifecycle is not currently set,
    # but adding a deny here costs nothing and protects future config flips).
    location ~ ^/-/(reload|quit) {
        deny all;
        return 403;
    }

    location / {
        auth_basic "BlueStream Monitoring";
        auth_basic_user_file /etc/nginx/auth/htpasswd_monitoring;

        proxy_pass http://$upstream_alertmanager:9093;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
