# Main Website: aqua-element.uz
# Serves: Landing pages, shop, public content, API endpoints

server {
    listen 80;
    server_name aqua-element.uz www.aqua-element.uz;

    set $upstream_business_app business_app;

    # Redirect www to non-www
    if ($host = www.aqua-element.uz) {
        return 301 $scheme://aqua-element.uz$request_uri;
    }

    # ==========================================================
    # CABINET ROUTES - Redirect to cabinet.aqua-element.uz
    # ==========================================================
    # my-account redirects to cabinet root
    location = /my-account {
        return 301 https://cabinet.aqua-element.uz/;
    }

    # Other cabinet pages redirect with their paths
    location ~ ^/(my-orders|my-subscriptions|addresses|profile-settings|account-security|my-loyalty|order-tracking)(/.*)?$ {
        return 301 https://cabinet.aqua-element.uz$request_uri;
    }

    # Root for static files
    root /var/www/static;

    # nginx is the single source of truth for security headers. The upstream Flask
    # app (Talisman + SecurityHeadersMiddleware) also emits these; without hiding
    # them the browser would receive two of each. Two Content-Security-Policy
    # headers are *intersected* (not merged), which silently blocked inline scripts,
    # Google Analytics and the Cloudflare beacon. `proxy_hide_header` is inherited
    # into every proxied location below (none override it). Feature-Policy is
    # deprecated and was emitted with invalid syntax by Talisman, so it is dropped
    # entirely (nginx does not re-add it).
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Feature-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy $permissions_policy always;
    add_header Content-Security-Policy $csp_policy always;

    # Static files - served directly by nginx (bypasses Flask)
    location /static/ {
        alias /var/www/static/;
        expires $expires;
        add_header Cache-Control "public, must-revalidate";
        access_log off;

        # Security headers for static files
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Uploaded files
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        # Prevent execution of uploaded files
        location ~* \.(php|py|pl|cgi|sh|asp|aspx|jsp)$ {
            deny all;
        }
    }

    # Favicon
    location = /favicon.ico {
        alias /var/www/static/images/favicon.ico;
        expires 1y;
        access_log off;
        log_not_found off;
    }

    # Robots.txt
    location = /robots.txt {
        alias /var/www/static/robots.txt;
        access_log off;
        log_not_found off;
    }

    # llms.txt — markdown index for AI assistants (https://llmstxt.org/).
    # Falls through to the Flask route if the static file is missing.
    location = /llms.txt {
        alias /var/www/static/llms.txt;
        default_type text/markdown;
        charset utf-8;
        access_log off;
        log_not_found off;
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # INF-003: /metrics is scraped by Prometheus on the Docker network only.
    # Block public access — exposing counters publicly leaks business intel and
    # makes it trivial for an attacker to watch for error-rate spikes.
    location = /metrics {
        deny all;
        return 403;
    }

    # API routes - proxy to Flask with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Authentication endpoints - stricter rate limiting
    location ~ ^/api/v1/(auth|login|register)/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # Webhook endpoints (Telegram, Payment providers) - no rate limiting
    # Special restricted endpoint for Payme Webhook
    location = /api/v1/payments/webhook/payme {
        # Payme IP Whitelist from 185.234.113.1 to 185.234.113.15 using CIDR notation
        # allow 185.234.113.0/28;
        # Add other Payme IPs if necessary
        # deny all;

        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Disable rate limiting for trusted Payme IPs
        proxy_buffering off;
    }

    location ~ ^/(telegram|payme|click)/ {
        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Disable buffering for webhooks
        proxy_buffering off;
    }

    # All other routes - Flask app (landing pages, shop, etc.)
    location / {
        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
