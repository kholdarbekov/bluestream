# Main Website: aqua-element.uz
# Serves: Landing pages, shop, public content, API endpoints

# www redirects to the bare domain. Its own server, so the "Open on website" sign-in path, whose query is a secret,
# can log redacted before its redirect. Always https: behind the Cloudflare Tunnel nginx sees plain http, so
# `$scheme` would send the browser (and a sign-in hash) through one plaintext hop.
server {
    listen 80;
    server_name www.aqua-element.uz;

    location = /auth/telegram-login {
        access_log /var/log/nginx/access.log redacted_query;
        error_log /var/log/nginx/error.log crit;
        return 301 https://aqua-element.uz$request_uri;
    }

    location / {
        return 301 https://aqua-element.uz$request_uri;
    }
}

server {
    listen 80;
    server_name aqua-element.uz;

    set $upstream_business_app business_app;

    # ==========================================================
    # CABINET ROUTES - Redirect to cabinet.aqua-element.uz
    # ==========================================================
    # my-account redirects to cabinet root
    location = /my-account {
        return 301 https://cabinet.aqua-element.uz/;
    }

    # Other cabinet pages redirect with their paths
    location ~ ^/(my-orders|my-subscriptions|addresses|profile-settings|account-security|my-loyalty|order-tracking)(/.*)?$ {
        return 301 https://cabinet.aqua-element.uz$request_uri;
    }

    # Root for static files
    root /var/www/static;

    # nginx is the single source of truth for security headers. The upstream Flask
    # app (Talisman + SecurityHeadersMiddleware) also emits these; without hiding
    # them the browser would receive two of each. Two Content-Security-Policy
    # headers are *intersected* (not merged), which silently blocked inline scripts,
    # Google Analytics and the Cloudflare beacon. `proxy_hide_header` is inherited
    # into every proxied location below (none override it). Feature-Policy is
    # deprecated and was emitted with invalid syntax by Talisman, so it is dropped
    # entirely (nginx does not re-add it).
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Feature-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy $permissions_policy always;
    add_header Content-Security-Policy $csp_policy always;

    # Static files - served directly by nginx (bypasses Flask)
    location /static/ {
        alias /var/www/static/;
        expires $expires;
        add_header Cache-Control "public, must-revalidate";
        access_log off;

        # Security headers for static files
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Uploaded files
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        # Prevent execution of uploaded files
        location ~* \.(php|py|pl|cgi|sh|asp|aspx|jsp)$ {
            deny all;
        }
    }

    # Favicon: the brand drop, the same file the pages link (images/brand/favicon.ico)
    location = /favicon.ico {
        alias /var/www/static/images/brand/favicon.ico;
        expires 1y;
        access_log off;
        log_not_found off;
    }

    # Robots.txt
    location = /robots.txt {
        alias /var/www/static/robots.txt;
        access_log off;
        log_not_found off;
    }

    # IndexNow key file (https://www.indexnow.org/documentation): proves we own the host. Logged, so the
    # verifier's fetch shows in Loki. The file name, its one line and this location must agree
    # (tests/unit/test_indexnow_key_file.py).
    location = /89fd7c5ccbd11a5de1e99ffaf2c251b6.txt {
        alias /var/www/static/89fd7c5ccbd11a5de1e99ffaf2c251b6.txt;
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # INF-003: /metrics is scraped by Prometheus on the Docker network only.
    # Block public access — exposing counters publicly leaks business intel and
    # makes it trivial for an attacker to watch for error-rate spikes.
    location = /metrics {
        deny all;
        return 403;
    }

    # API routes - proxy to Flask with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Telegram identity endpoints are bot-only (the bots call business_app over
    # the internal Docker network, never this host) or were removed. First
    # matching regex location wins, so keep this above the proxying locations.
    location ~ ^/api/v1/auth/(telegram-login|telegram-register|check-phone-availability|link-phone-account/(send-otp|verify)|link-telegram|link-web-account|sync-profile|suggest-auto-link|generate-telegram-auth|generate-web-auth|verify-telegram-auth/[^/]+|verify-web-auth/[^/]+)/?$ {
        return 404;
    }

    # Every /api/v1/bot/ route is bot-only and signed (the bots call business_app on the internal
    # Docker network), and web-link/confirm answers tokens. Keep it above the proxying locations.
    location ~ ^/api/v1/bot/ {
        return 404;
    }

    # Authentication endpoints - stricter rate limiting
    location ~ ^/api/v1/(auth|login|register)/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # Webhook endpoints (Telegram, Payment providers) - no rate limiting
    # Special restricted endpoint for Payme Webhook
    location = /api/v1/payments/webhook/payme {
        # Payme IP Whitelist from 185.234.113.1 to 185.234.113.15 using CIDR notation
        # allow 185.234.113.0/28;
        # Add other Payme IPs if necessary
        # deny all;

        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Disable rate limiting for trusted Payme IPs
        proxy_buffering off;
    }

    location ~ ^/(telegram|payme|click)/ {
        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Disable buffering for webhooks
        proxy_buffering off;
    }

    # "Open on website" (Telegram login button): its query is the customer's Telegram identity and a hash that
    # signs them in for five minutes, so nothing here writes it down. Exact match: wins over every location.
    # - The access log keeps the path only (redacted_query).
    # - The error log keeps `crit` only: nginx's own error lines (an upstream down, a refused request) quote the
    #   whole request line.
    # - An error page of its own: the server's /50x.html location logs in `main` (query included).
    # - A refused request answers 429 (the default 503 would be an error page) and logs below `warn`.
    location = /auth/telegram-login {
        limit_req zone=telegram_login_limit burst=5 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        access_log /var/log/nginx/access.log redacted_query;
        error_log /var/log/nginx/error.log crit;
        error_page 500 502 503 504 /50x-login.html;

        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # All other routes - Flask app (landing pages, shop, etc.)
    location / {
        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # The sign-in's error page: the same page, logged redacted (the request line it stands for holds the secret).
    location = /50x-login.html {
        internal;
        access_log /var/log/nginx/access.log redacted_query;
        error_log /var/log/nginx/error.log crit;
        alias /usr/share/nginx/html/50x.html;
    }
}
