# bluestream.uz - Click payment webhook forwarding only
# Click payment gateway webhook URL cannot be changed, so we keep this
# server block solely to forward Click webhooks to the backend.
# All other requests are dropped with 444 (no response).

server {
    listen 80;
    server_name bluestream.uz www.bluestream.uz;

    set $upstream_business_app business_app;

    # Click payment webhook - forward to Flask backend
    location = /api/v1/payments/webhook/click {
        proxy_pass http://$upstream_business_app:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_buffering off;
    }

    # Drop everything else silently
    location / {
        return 444;
    }
}
