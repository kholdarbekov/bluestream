# Customer Cabinet: cabinet.aqua-element.uz
# Serves: Authenticated user area (my-account, my-orders, subscriptions, etc.)

server {
    listen 80;
    server_name cabinet.aqua-element.uz;

    root /var/www/static;

    # Stricter security headers for authenticated area
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy $permissions_policy always;
    add_header Content-Security-Policy $csp_policy always;

    # Ensure crawlers do not index private cabinet surfaces.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # INF-003: /metrics is internal only (Prometheus scrapes on Docker network).
    location = /metrics {
        deny all;
        return 403;
    }

    # ==========================================================
    # NON-CABINET ROUTES - Redirect back to aqua-element.uz
    # ==========================================================
    # Main site pages should use the main domain
    location ~ ^/(shop|cart|checkout|about|contact|services|gallery|terms|privacy|blog|login|register|forgot-password|reset-password|subscriptions|order-confirmation|payment-success|payment-cancel)(/.*)?$ {
        return 301 https://aqua-element.uz$request_uri;
    }

    # Static files
    location /static/ {
        alias /var/www/static/;
        expires $expires;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # Uploaded files
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Root URL serves my-account page (rewrite to Flask route)
    location = / {
        rewrite ^ /my-account break;
        proxy_pass http://business_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API routes with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://business_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cabinet pages - proxy to Flask
    # Routes: /my-account, /my-orders, /my-subscriptions, /addresses, /profile-settings, etc.
    location / {
        proxy_pass http://business_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # No caching for authenticated pages
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
