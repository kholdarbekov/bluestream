# Flower (Celery monitoring): flower.aqua-element.uz
# Upstream: flower:5555 (mher/flower)
#
# Auth: Flower's own basic auth via FLOWER_BASIC_AUTH (required in
# docker-compose.production.yml). No additional nginx auth — double
# basic-auth prompts confuse browsers and Flower's session cookie already
# survives one browser tab.
#
# WebSocket / SSE: Flower's task event stream uses long-lived connections;
# proxy_buffering must be off and Connection: upgrade forwarded.

server {
    listen 80;
    server_name flower.aqua-element.uz;

    set $upstream_flower flower;

    # Strict headers — Flower is an internal admin tool, never indexed.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Health check (skips Flower, returns directly)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://$upstream_flower:5555;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Long-lived event stream (/api/task/events) needs upgrade headers
        # and unbuffered output, otherwise the UI never sees task updates.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
