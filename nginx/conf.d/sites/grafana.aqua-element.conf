# Grafana: grafana.aqua-element.uz
# Upstream: grafana:3000
#
# Auth: Grafana's own admin login + RBAC. No nginx auth — Grafana's session
# cookies and login UI are nicer than a basic-auth prompt, and double-auth
# would break the OAuth/SAML upgrade path.
#
# WebSocket: Grafana Live (live tail panels, alert state push) uses
# /api/live/ws — needs Connection: upgrade forwarded. Pattern from
# https://grafana.com/tutorials/run-grafana-behind-a-proxy/ .
#
# GF_SERVER_ROOT_URL=https://grafana.aqua-element.uz must be set in the
# grafana service env (docker-compose.production.yml) so login redirects
# and share links use the public hostname.

server {
    listen 80;
    server_name grafana.aqua-element.uz;

    set $upstream_grafana grafana;

    # Grafana sets its own X-Frame-Options. Don't override frame-ancestors —
    # admins may legitimately embed dashboards in admin.aqua-element.uz.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # nginx-level health check (does not touch Grafana)
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Grafana Live WebSocket endpoint — must come before the catch-all.
    location /api/live/ {
        proxy_pass http://$upstream_grafana:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://$upstream_grafana:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Allow long-running queries against Loki/Prometheus from the UI.
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
