# Loki: loki.aqua-element.uz
# Upstream: loki:3100
#
# Auth: htpasswd (shared with prometheus + alertmanager).
#
# /loki/api/v1/push is denied at the public edge so a leaked credential
# can't be used to inject log lines (which would corrupt dashboards / alert
# rules built on log volume). Internal log shippers — when added in OTel
# migration Phase 1 — push to loki:3100 directly on the Docker network and
# never touch nginx, so this restriction has no impact on log ingestion.

server {
    listen 80;
    server_name loki.aqua-element.uz;

    set $upstream_loki loki;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Block log ingestion endpoints from the public edge.
    location ^~ /loki/api/v1/push {
        deny all;
        return 403;
    }
    location ^~ /otlp/v1/logs {
        deny all;
        return 403;
    }

    location / {
        auth_basic "BlueStream Monitoring";
        auth_basic_user_file /etc/nginx/auth/htpasswd_monitoring;

        proxy_pass http://$upstream_loki:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Long-running tail queries via /loki/api/v1/tail (websocket-ish).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
