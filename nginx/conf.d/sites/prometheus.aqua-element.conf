# Prometheus: prometheus.aqua-element.uz
# Upstream: prometheus:9090
#
# Auth: htpasswd in front (Prometheus has no native auth). The same htpasswd
# file gates loki + alertmanager — one shared credential set for the raw-API
# monitoring services. Manage via scripts/manage-monitoring-auth.sh.
#
# Defense-in-depth: even with valid creds, block the lifecycle / admin
# endpoints. --web.enable-lifecycle is on in production so /-/reload would
# otherwise let any authed user replace scrape configs by reloading from a
# poisoned file. Admin API can delete tsdb data.

server {
    listen 80;
    server_name prometheus.aqua-element.uz;

    set $upstream_prometheus prometheus;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # nginx-level health check (does not touch Prometheus)
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Block lifecycle + admin endpoints regardless of auth.
    location ~ ^/(-/reload|-/quit|api/v[12]/admin) {
        deny all;
        return 403;
    }

    location / {
        auth_basic "BlueStream Monitoring";
        auth_basic_user_file /etc/nginx/auth/htpasswd_monitoring;

        proxy_pass http://$upstream_prometheus:9090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Heavy queries (/api/v1/query_range over weeks) can take a while.
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
