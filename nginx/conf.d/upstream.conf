# Runtime DNS resolution via Docker's embedded resolver (127.0.0.11).
#
# Why no `upstream { ... }` blocks: nginx OSS resolves hostnames inside
# upstream blocks once, at config-load time. If a backend container's DNS
# entry is briefly unavailable during a deploy (e.g. just after `docker
# compose restart nginx`), nginx exits with `[emerg] host not found in
# upstream` and the container restart-loops until DNS recovers.
#
# Instead, each server block declares `set $upstream_<name> <name>;` and
# uses `proxy_pass http://$upstream_<name>:80;`. The variable form makes
# nginx defer resolution to request time, going through the resolver
# below — so a transient DNS miss yields a single 502, not a crashed
# nginx.
resolver 127.0.0.11 ipv6=off valid=10s;
