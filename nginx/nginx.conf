# Worker processes auto-scaled to CPU cores
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # The real client address (owner, 2026-10-29). Production's front door is a Cloudflare Tunnel: cloudflared on the
    # host connects to the published port (loopback only, docker-compose.yml), so every request arrives from the
    # Docker bridge gateway (172.18.0.1) or loopback, and without this every limit_req zone below was one bucket for
    # the whole site. Cloudflare's edge sets CF-Connecting-IP to the client and overwrites any value a client sends;
    # only those local hops are trusted to carry it. $remote_addr is then the customer: in every log line, every
    # limit_req zone, allow/deny, and the X-Real-IP and last X-Forwarded-For entry sent upstream (which Flask's
    # ProxyFix reads). A request without the header (the nginx exporter on the compose network) keeps its own address.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Logging format with timing metrics
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # The path without its query (no $request, $request_uri, $args or Referer): for a URL whose query is a secret,
    # the "Open on website" sign-in (/auth/telegram-login), which carries a signed hash and the customer's names.
    # The forwarded client addresses stay, for forensics (they are not secret).
    log_format redacted_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                              '"$http_user_agent" "$http_x_forwarded_for" "$http_cf_connecting_ip" rt=$request_time';

    # "Open on website" has its own budget, so the API's sign-in calls never spend it (and it never spends theirs).
    limit_req_zone $binary_remote_addr zone=telegram_login_limit:10m rate=5r/m;

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Buffer settings (optimized for Raspberry Pi)
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    client_max_body_size 50M;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Security - Hide version
    server_tokens off;

    # Include modular configs
    include /etc/nginx/conf.d/upstream.conf;
    include /etc/nginx/conf.d/security.conf;
    include /etc/nginx/conf.d/compression.conf;
    include /etc/nginx/conf.d/caching.conf;
    include /etc/nginx/conf.d/sites/*.conf;
}
