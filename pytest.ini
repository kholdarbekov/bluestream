[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=business_app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    -n auto
    --dist=loadfile
markers =
    analytics: Analytics tests
    cart: Cart related tests
    delivery: Delivery related tests
    inventory: Inventory related tests
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end multi-step journey tests
    security: Security tests
    performance: Performance tests
    critical: Critical business logic tests
    payment: Payment related tests
    order: Order related tests
    auth: Authentication tests
    product: Product related tests
    review: Review related tests
    slow: Tests that take a long time
    api: API endpoint tests
    contract: API contract / route-surface tests (TST-002)
    unreachable_by_design: opts a test out of the autouse REACHABILITY oracle in tests/integration/test_place_concurrency_pg_e2e.py — for the known-bad controls and constraint tests that manufacture an unreachable row on purpose
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
